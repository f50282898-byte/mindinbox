<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="محراب التفريغ الذهني - مساحة حرة لإلقاء فوضى الخواطر وحرق الشحنات العصبية اللحظية.">
    <meta name="theme-color" content="#040406">
    
    <title>عقل في صندوق | محراب التفريغ</title>

    <!-- تحسين أداء الاتصال بالخطوط والخدمات السحابية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- منظومة الخطوط المؤسسية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- نظام التصميم المعماري الفلسفي -->
    <link rel="stylesheet" href="style.css">

    <!-- حزم Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- محرك الذكاء الاصطناعي المركزي -->
    <script src="ai.js"></script>

    <!-- النواة المشتركة: المخطوطة، الشريط، الفزع، الحصانة -->
    <script src="brand.js" defer></script>
    <script src="core.js" defer></script>

    <style>
        /* ==========================================================================
           1. المتغيرات المعمارية (Design System Variables)
           ========================================================================== */
        :root {
            --bg-base: #040406;
            --bg-surface: #0a0a0f;
            --bg-surface-elevated: rgba(18, 18, 26, 0.75);
            --bg-glass-heavy: rgba(12, 12, 18, 0.85);
            
            --gold-primary: #c5a059;
            --gold-light: #e5b964;
            --gold-dark: #8b6d36;
            --gold-glow-soft: rgba(197, 160, 89, 0.15);
            --gold-glow-strong: rgba(197, 160, 89, 0.45);
            --gold-border: rgba(197, 160, 89, 0.25);
            --gold-border-focus: rgba(229, 185, 100, 0.6);
            
            --text-primary: #f8f8fa;
            --text-secondary: #a1a5b0;
            --text-tertiary: #6b6f7a;
            
            --color-success: #2ecc71;
            --color-error: #e74c3c;
            
            --shadow-md: 0 15px 35px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 25px 60px rgba(0, 0, 0, 0.85);
            --blur-md: blur(16px);
            --blur-lg: blur(24px);
            
            --trans-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --trans-medium: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ==========================================================================
           2. إعادة ضبط العناصر (CSS Reset)
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(197, 160, 89, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 90%, rgba(18, 18, 28, 0.95) 0%, transparent 60%);
            background-attachment: fixed;
        }

        /* ==========================================================================
           3. الترويسة العلوية والملاحة (Navigation)
           ========================================================================== */
        .sanctuary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 4%;
            background: rgba(6, 6, 8, 0.85);
            backdrop-filter: var(--blur-md);
            border-bottom: 1px solid var(--gold-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--trans-fast);
        }

        .back-link:hover {
            color: var(--gold-light);
            transform: translateX(4px);
        }

        .brand-title {
            font-family: 'Amiri', serif;
            color: var(--gold-primary);
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .quota-indicator {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--gold-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--gold-light);
            font-weight: 700;
            display: none; /* يظهر للمجاني فقط */
            box-shadow: 0 0 10px var(--gold-glow-soft);
        }

        /* ==========================================================================
           4. المساحة الإعلانية الحصرية (Exclusive Ad Banner)
           ========================================================================== */
        .exclusive-ad-banner {
            width: 92%;
            max-width: 1000px;
            margin: 24px auto 0 auto;
            background: linear-gradient(90deg, rgba(20, 20, 28, 0.6), rgba(12, 12, 18, 0.8), rgba(20, 20, 28, 0.6));
            border: 1px dashed rgba(197, 160, 89, 0.2);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .exclusive-ad-banner::before {
            content: "مساحة إعلانية مخصصة";
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            letter-spacing: 1px;
        }

        /* ==========================================================================
           5. منطقة التفريغ ومسودة العمل (Workspace Area)
           ========================================================================== */
        .workspace-container {
            max-width: 1000px;
            width: 92%;
            margin: 32px auto 60px auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
            flex: 1;
        }

        .discharge-panel {
            background: var(--bg-surface-elevated);
            backdrop-filter: var(--blur-md);
            border: 1px solid var(--gold-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 20px;
        }

        .panel-header h1 {
            font-family: 'Amiri', serif;
            color: var(--gold-light);
            font-size: 2rem;
            line-height: 1.2;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-mic {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--gold-border);
            color: var(--gold-light);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .btn-mic:hover {
            background: var(--gold-primary);
            color: var(--bg-base);
        }
        .btn-mic.recording {
            animation: pulseError 1.5s infinite;
            background: rgba(231,76,60,0.2);
            border-color: rgba(231,76,60,0.5);
            color: #e74c3c;
        }

        .sync-status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            transition: var(--trans-fast);
        }

        .sync-status-badge.synced {
            color: var(--color-success);
            border-color: rgba(46, 204, 113, 0.3);
        }

        .sync-status-badge.saving {
            color: var(--gold-light);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* حقل النصوص الفلسفي */
        .textarea-ghost-wrapper {
            position: relative;
            width: 100%;
        }
        .textarea-ghost-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1554188248-986adbb73be4?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
            opacity: 0.1;
            mix-blend-mode: luminosity;
            pointer-events: none;
            border-radius: 4px;
        }

        .discharge-textarea {
            width: 100%;
            height: 380px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 24px;
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 1.15rem;
            line-height: 1.8;
            resize: vertical;
            outline: none;
            transition: border-color var(--trans-fast);
            position: relative;
            z-index: 1;
        }

        .discharge-textarea:focus {
            border-color: var(--gold-border);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .discharge-textarea::placeholder {
            color: var(--text-tertiary);
            font-style: italic;
        }

        /* Tools Footer */
        .workspace-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }

        .char-count {
            color: var(--text-tertiary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .actions-group {
            display: flex;
            gap: 16px;
        }

        /* ==========================================================================
           6. Burn Logic (Cognitive Friction - Hold to Burn)
           ========================================================================== */
        .btn-burn {
            background: rgba(231, 76, 60, 0.1);
            color: var(--color-error);
            border: 1px solid var(--color-error-border);
            padding: 12px 24px;
            border-radius: 4px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--trans-fast);
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .btn-burn-progress {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: rgba(231, 76, 60, 0.25);
            z-index: 0;
            pointer-events: none;
        }
        
        .btn-burn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-insight {
            background: var(--gold-primary);
            color: var(--bg-base);
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--trans-fast);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
        }

        .btn-insight:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(197, 160, 89, 0.4);
        }

        /* أدوات التحكم (Control Actions) */
        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 10px;
        }

        .btn-core {
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--trans-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-analyze {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
            color: var(--bg-base);
            flex: 2;
            box-shadow: 0 8px 20px var(--gold-glow-soft);
        }

        .btn-analyze:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--gold-glow-strong);
        }

        .btn-analyze:disabled {
            opacity: 0.7;
            cursor: wait;
            filter: grayscale(0.5);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            flex: 1;
        }

        .btn-clear:hover {
            background: rgba(231, 76, 60, 0.1);
            border-color: var(--color-error);
            color: #ff7675;
        }

        /* مؤشر التحميل (Spinner) */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        .btn-analyze.loading .spinner { display: block; }
        .btn-analyze.loading .btn-text { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==========================================================================
           6. صندوق بصيرة الذكاء الاصطناعي (AI Insight Panel)
           ========================================================================== */
        .ai-insight-panel {
            background: linear-gradient(145deg, rgba(20, 20, 30, 0.9), var(--bg-surface-elevated));
            border: 1px solid var(--gold-primary);
            border-radius: 20px;
            padding: 32px;
            box-shadow: var(--shadow-lg), 0 0 40px var(--gold-glow-soft);
            display: none; /* يظهر فقط بعد الاستنطاق */
            flex-direction: column;
            gap: 16px;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-insight-header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--gold-border);
            padding-bottom: 16px;
        }

        .ai-insight-header h3 {
            font-family: 'Amiri', serif;
            color: var(--gold-light);
            font-size: 1.5rem;
        }

        .ai-insight-body {
            font-family: 'Amiri', serif;
            font-size: 1.25rem;
            line-height: 2.2;
            color: #eaecef;
            white-space: pre-line;
        }

        /* ==========================================================================
           6.5 محدد رتبة الحكيم (Sage Tier Selector)
           ========================================================================== */
        .tier-selector-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .tier-chip {
            background: rgba(10, 10, 16, 0.75);
            border: 1px solid var(--gold-border);
            border-radius: var(--radius-xs, 2px);
            padding: 9px 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            transition: all var(--trans-fast, 0.35s);
            outline: none;
        }
        .tier-chip:hover {
            border-color: var(--gold-primary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .tier-chip.active {
            background: rgba(197, 160, 89, 0.12);
            border-color: var(--gold-primary);
            color: var(--gold-light);
            box-shadow: 0 0 16px var(--gold-glow-soft);
        }
        .tier-badge {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 2px;
            background: var(--gold-glow-soft);
            color: var(--gold-light);
            border: 1px solid var(--gold-border);
            letter-spacing: 0.05em;
        }
        .tier-chip[data-tier="ultra"] .tier-badge {
            background: rgba(231, 76, 60, 0.15);
            color: #ff8a80;
            border-color: rgba(231, 76, 60, 0.35);
        }
        .tier-chip[data-tier="standard"] .tier-badge {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-tertiary);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* ==========================================================================
           7. التذييل (Footer)
           ========================================================================== */
        .site-footer {
            text-align: center;
            padding: 24px;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(4, 4, 6, 0.8);
        }

        /* ==========================================================================
           8. التوافقية مع الشاشات (Responsive)
           ========================================================================== */
        @media (max-width: 768px) {
            .sanctuary-header { padding: 16px 20px; }
            .workspace-container { margin-top: 20px; gap: 24px; }
            .discharge-panel { padding: 24px; }
            .discharge-textarea { height: 280px; font-size: 1.2rem; }
            .actions-row { flex-direction: column; }
            .btn-core { width: 100%; }
            .exclusive-ad-banner { margin-top: 16px; padding: 12px; }
        }
    </style>
    <!-- FOUC Theme Preventer -->
    <script>
        (function() {
            try {
                if (localStorage.getItem('mind_theme_preference') === 'manuscript') {
                    document.documentElement.setAttribute('data-mode', 'manuscript');
                }
            } catch(e) {}
        })();
    </script>
</head>
<body>

    <header class="sanctuary-header">
        <a href="dashboard.html" class="back-link">
            <span>&rarr;</span> العودة للملاذ
        </a>
        <div class="brand-title">محراب التفريغ</div>
        <div class="quota-indicator" id="quotaDisplay">جاري الاتصال...</div>
    </header>

    <!-- المساحة الإعلانية الوحيدة والمخصصة بأعلى الصفحة -->
    <div class="exclusive-ad-banner">
        <!-- مساحة إعلانات مدمجة (Google AdSense أو غيره) توضع هنا -->
    </div>

    <main class="workspace-container">

        <!-- لوحة التفريغ الرئيسية -->
        <section class="discharge-panel flame-bg">
            <div class="panel-header">
                <h1>حرق الشحنات وإلقاء الفوضى</h1>
                <div class="sync-status-badge" id="syncStatus">
                    <span class="status-dot"></span>
                    <span id="syncText">جاهز للكتابة</span>
                </div>
            </div>

            <div class="textarea-sage-wrapper">
                <textarea class="discharge-textarea" id="dischargeInput" placeholder="اكتب دون تجميل ودون تنقيح... ألقِ بكل ما يزحم عقلك ويثقل صدرك هنا. هذا المحراب لا يحتفظ بالأحكام، بل يفككها."></textarea>
            </div>

            <!-- محدد مستوى الحكيم الثلاثي -->
            <div class="tier-selector-container" id="sageTierSelector">
                <button type="button" class="tier-chip" data-tier="standard" title="حكمة مستخلصة فوراً من أرشيف المنصة العضوي دون استهلاك الـ API">
                    <span class="tier-badge">عادي</span>
                    <span>الأرشيف العضوي</span>
                </button>
                <button type="button" class="tier-chip active" data-tier="pro" title="تحليل سقراطي عميق يفكك الجذور النفسية للخواطر">
                    <span class="tier-badge">Pro</span>
                    <span>التحليل السقراطي</span>
                </button>
                <button type="button" class="tier-chip" data-tier="ultra" title="رؤية وجودية حارقة تربط يومياتك بكتل الفلسفة الكبرى">
                    <span class="tier-badge">Ultra</span>
                    <span>الرؤية الوجودية</span>
                </button>
            </div>

            <div class="actions-row">
                <button class="btn-core btn-burn" id="btnHoldBurn">
                    <span class="btn-text">احتكاك الحرق (اضغط مطولاً للتطهير)</span>
                    <div class="burn-progress-bar" id="burnProgressBar"></div>
                </button>
                <button class="btn-core btn-analyze" id="btnAnalyzeDraft">
                    <span class="btn-text">استنطاق الحكيم لاستخلاص المعنى</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </section>

        <!-- صندوق رد الذكاء الاصطناعي (مخطوطة البردي) -->
        <section class="ai-insight-panel papyrus-surface" id="aiInsightPanel" style="border: 1px solid var(--gold-border); padding: 32px; border-radius: 12px; margin-top: 24px; display: none;">
            <div class="ai-insight-header" style="border-bottom: 1px solid rgba(181, 149, 81, 0.3); padding-bottom: 16px; margin-bottom: 24px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <h3 style="color: var(--gold-primary); font-family: 'Amiri', serif; font-size: 1.6rem;">بصيرة الحكيم حول خواطرك</h3>
            </div>
            <div class="ai-insight-body" id="aiInsightContent" style="color: #2c251d; font-weight: 600; text-shadow: none;">
                <!-- يُحقن النص هنا عبر JavaScript -->
            </div>
            <div style="text-align: left; margin-top: 20px;">
                <button class="btn-handwritten-close" onclick="document.getElementById('aiInsightPanel').style.display='none'" title="إخفاء المخطوطة">
                    <svg viewBox="0 0 24 24"><path d="M4 5L19 20M20 4L5 19"/></svg>
                </button>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        جميع حقوق الهندسة المعرفية محفوظة &copy; 2026 - عقل في صندوق
    </footer>

    <!-- ==========================================================================
         الهندسة البرمجية (JavaScript Core Logic)
         ========================================================================== -->
    <script>
        /**
         * 1. التهيئة السحابية (Firebase Configuration)
         */
        const firebaseConfig = {
            apiKey: "AIzaSyDGgTDrDJsRvulhzK1p59AbuhJwQYSUufI",
            authDomain: "mindinbox-50d84.firebaseapp.com",
            projectId: "mindinbox-50d84",
            storageBucket: "mindinbox-50d84.firebasestorage.app",
            messagingSenderId: "1087016266441",
            appId: "1:1087016266441:web:6d5242057c39e744ee3b18"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        /**
         * 2. متحكم المحراب (Meditation Engine)
         */
        const MeditationController = (() => {
            // DOM Elements
            const txtInput = document.getElementById('dischargeInput');
            const syncStatusBadge = document.getElementById('syncStatus');
            const syncText = document.getElementById('syncText');
            const btnClear = document.getElementById('btnClearDraft');
            const btnAnalyze = document.getElementById('btnAnalyzeDraft');
            const aiPanel = document.getElementById('aiInsightPanel');
            const aiContent = document.getElementById('aiInsightContent');
            const quotaDisplay = document.getElementById('quotaDisplay');

            let saveTimeout = null;
            const STORAGE_KEY = 'mind_discharge_draft_v3';

            // حالة المزامنة
            function setSyncState(state) {
                syncStatusBadge.className = 'sync-status-badge'; // Reset
                if (state === 'saving') {
                    syncStatusBadge.classList.add('saving');
                    syncText.textContent = "جاري الحفظ اللحظي...";
                } else if (state === 'synced') {
                    syncStatusBadge.classList.add('synced');
                    syncText.textContent = "محفوظ بأمان (سحابياً ومحلياً)";
                } else if (state === 'empty') {
                    syncText.textContent = "المحراب مطهر";
                }
            }

            // تحديث واجهة الحصص من ai.js
            function updateQuotaUI() {
                if (!window.AIAdvisor) return;
                const status = window.AIAdvisor.getStatus();
                if (status.isPremium) {
                    quotaDisplay.style.display = 'none';
                } else {
                    quotaDisplay.style.display = 'inline-block';
                    quotaDisplay.textContent = `طاقة المستشار: ${status.limit - status.used}/${status.limit}`;
                }
            }

            // التحميل المبدئي للمسودة
            function loadDraft() {
                const localDraft = localStorage.getItem(STORAGE_KEY);
                if (localDraft) {
                    txtInput.value = localDraft;
                    setSyncState('synced');
                }
            }

            // === 3. تدمير الأنا (Ego Destruction Logic) ===
            function enforceEgoDestruction(text) {
                const egoRegex = /\b(أنا|لي|حقي|نفسي|أريد)\b/g;
                const matches = text.match(egoRegex) || [];
                const egoCount = matches.length;
                
                // Base size is 1.2rem (approx 19px). Shrink slightly for every ego word.
                // Max reduction down to 0.75rem (approx 12px) to break the ego visually.
                const baseSize = 1.2;
                const minSize = 0.75;
                const newSize = Math.max(minSize, baseSize - (egoCount * 0.05));
                
                txtInput.style.fontSize = newSize + 'rem';
                txtInput.style.transition = 'font-size 0.5s ease';
            }

            // عملية الحفظ التلقائي (Debounced)
            function handleInput() {
                const val = txtInput.value;
                localStorage.setItem(STORAGE_KEY, val);
                setSyncState('saving');
                
                enforceEgoDestruction(val); // العقاب الذاتي على النرجسية

                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(async () => {
                    const user = auth.currentUser;
                    if (user && val.trim().length > 0) {
                        try {
                            await db.collection('users').doc(user.uid).collection('protocol').doc('meditation_draft').set({
                                content: val,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true });
                            setSyncState('synced');
                        } catch (error) {
                            console.error("Cloud sync failed:", error);
                            syncText.textContent = "محفوظ محلياً فقط (خطأ شبكة)";
                        }
                    } else if (val.trim().length === 0) {
                        setSyncState('empty');
                    }
            }

            // === Voice Dictation Logic (One-Shot Flow) ===
            const btnMic = document.getElementById('btnMic');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition;
            let isRecording = false;

            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ar-SA'; // Strict Arabic

                recognition.onstart = function() {
                    isRecording = true;
                    btnMic.classList.add('recording');
                    btnMic.querySelector('span').textContent = 'جاري الاستماع... (انقر للإيقاف)';
                };

                recognition.onresult = function(event) {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript + ' ';
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        txtInput.value += (txtInput.value ? ' ' : '') + finalTranscript;
                        handleInput(); // Trigger sync and ego check
                    }
                };

                recognition.onerror = function(event) {
                    console.error('Speech recognition error', event.error);
                    stopRecording();
                };

                recognition.onend = function() {
                    stopRecording();
                };

                function stopRecording() {
                    isRecording = false;
                    btnMic.classList.remove('recording');
                    btnMic.querySelector('span').textContent = 'تحدث ليتدفق الوعي';
                }

                btnMic.addEventListener('click', () => {
                    if (isRecording) {
                        recognition.stop();
                    } else {
                        recognition.start();
                    }
                });
            } else {
                btnMic.style.display = 'none'; // Hide if browser doesn't support it
            }

            // === 4. الاحتكاك المعرفي (Hold to Burn Logic) ===
            const btnHoldBurn = document.getElementById('btnHoldBurn');
            const burnProgressBar = document.getElementById('burnProgressBar');
            let burnTimer = null;
            let burnProgress = 0;
            const BURN_DURATION = 3000; // 3 Seconds
            const BURN_TICK = 30; // 30ms

            function startBurn(e) {
                if(e) { e.preventDefault(); e.stopPropagation(); }
                if (txtInput.value.trim() === '') return; // لا تحرق فراغاً
                if (burnProgress >= 100) return;

                burnTimer = setInterval(() => {
                    burnProgress += (BURN_TICK / BURN_DURATION) * 100;
                    if(burnProgressBar) burnProgressBar.style.width = burnProgress + '%';
                    
                    if (burnProgress >= 100) {
                        completeBurn();
                    }
                }, BURN_TICK);
            }

            function cancelBurn(e) {
                if(e) e.preventDefault();
                if (burnTimer) clearInterval(burnTimer);
                
                // عقاب: إذا أفلت قبل أن يكتمل الحرق، تهتز الشاشة
                if (burnProgress > 0 && burnProgress < 100) {
                    document.body.classList.add('shake-active');
                    setTimeout(() => document.body.classList.remove('shake-active'), 400);
                }
                
                if (burnProgress < 100) {
                    burnProgress = 0;
                    if(burnProgressBar) burnProgressBar.style.width = '0%';
                }
            }

            async function completeBurn() {
                clearInterval(burnTimer);
                if(burnProgressBar) burnProgressBar.style.width = '100%';
                
                // تأثير تلاشي الروح (Soul Fade)
                txtInput.classList.add('soul-fade');
                
                setTimeout(async () => {
                    txtInput.value = '';
                    txtInput.style.fontSize = '1.2rem'; // Reset Ego
                    txtInput.classList.remove('soul-fade');
                    burnProgress = 0;
                    if(burnProgressBar) burnProgressBar.style.width = '0%';
                    
                    localStorage.removeItem(STORAGE_KEY);
                    setSyncState('empty');
                    aiPanel.style.display = 'none';
                    
                    const user = auth.currentUser;
                    if (user) {
                        try {
                            await db.collection('users').doc(user.uid).collection('protocol').doc('meditation_draft').delete();
                        } catch (e) { /* ignore */ }
                    }
                }, 2500); // 2.5 seconds matching CSS animation
            }

            // إعداد محدد مستويات الحكيم الثلاثي
            let selectedSageTier = 'pro';
            const tierChips = document.querySelectorAll('#sageTierSelector .tier-chip');
            tierChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    tierChips.forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    selectedSageTier = chip.dataset.tier || 'pro';
                    if (window.AICore && window.AICore.setTier) {
                        window.AICore.setTier(selectedSageTier);
                    }
                });
            });

            // استنطاق الذكاء الاصطناعي (المخطوطة)
            async function analyzeThoughts() {
                const text = txtInput.value.trim();
                
                if (!text) {
                    alert("المحراب فارغ. ألقِ فيه بعض الكلمات أولاً ليتأملها الحكيم.");
                    return;
                }

                // UI Loading State
                btnAnalyze.classList.add('loading');
                btnAnalyze.disabled = true;
                btnHoldBurn.style.opacity = '0.5';
                btnHoldBurn.style.pointerEvents = 'none';
                
                aiPanel.style.display = 'block';
                aiPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });

                // مؤشر التأمل وتوهج الحبر المقدس
                if (window.AICore && window.AICore.showTypingIndicator) {
                    const statusText = selectedSageTier === 'ultra' 
                        ? 'الحكيم يستحضر الرؤية الوجودية ويربط خواطرك بكتل الفكر الكبرى...' 
                        : (selectedSageTier === 'standard' 
                            ? 'الحكيم يستنبط الحكمة من الأرشيف العضوي...' 
                            : 'الحكيم يفكك الجذور النفسية للخواطر بأسلوب سقراطي...');
                    window.AICore.showTypingIndicator(aiContent, statusText);
                } else {
                    aiContent.innerHTML = '<span style="color: var(--gold-dark);">الحكيم يتأمل ما بين السطور ويفكك فوضى الخواطر...</span>';
                }

                try {
                    // الاستدعاء عبر نظام الطابور ومحرك المستويات
                    const result = await (window.AICore ? window.AICore.ask(text, selectedSageTier) : window.AIAdvisor.ask(text, selectedSageTier));
                    const insightText = typeof result === 'object' ? result.text : result;
                    
                    // محاكاة الكتابة البشرية الواقعية (Human Cadence Typewriter)
                    if (window.AICore && window.AICore.typewriter) {
                        await window.AICore.typewriter(aiContent, insightText);
                    } else {
                        aiContent.innerHTML = `<p style="line-height:2.2;font-size:1.2rem;color:#33291f;margin:0;">${insightText}</p>`;
                    }
                    
                    if (typeof updateQuotaUI === 'function') updateQuotaUI();
                    
                } catch (error) {
                    console.error("AI Analysis Error:", error);
                    const organicFallback = (window.AICore && window.AICore.getOrganicWisdom) 
                        ? window.AICore.getOrganicWisdom(text)
                        : "كل هذه المعاناة منبعها تصورك، وليس الواقع. الكلمة التي كتبتها هي ظل وهمك. اطوِ هذه المخطوطة، وامضِ للعمل.";
                    
                    if (window.AICore && window.AICore.typewriter) {
                        await window.AICore.typewriter(aiContent, organicFallback);
                    } else {
                        aiContent.innerHTML = `<p style="line-height:2.2;font-size:1.2rem;color:#33291f;margin:0;">${organicFallback}</p>`;
                    }
                } finally {
                    btnAnalyze.classList.remove('loading');
                    btnAnalyze.disabled = false;
                    btnHoldBurn.style.opacity = '1';
                    btnHoldBurn.style.pointerEvents = 'auto';
                }
            }

            // إغلاق المخطوطة
            document.getElementById('btnCloseInsight')?.addEventListener('click', () => {
                aiPanel.style.display = 'none';
            });

            // المراقبة وربط الأحداث
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    window.location.replace("index.html");
                } else {
                    // تهيئة الذكاء الاصطناعي لجلب الحصص
                    if (window.AIAdvisor) {
                        await window.AIAdvisor.init(user, db);
                        updateQuotaUI();
                    }

                    // جلب النسخة السحابية إذا لم تكن موجودة محلياً
                    loadDraft();
                    if (!txtInput.value.trim()) {
                        try {
                            const doc = await db.collection('users').doc(user.uid).collection('protocol').doc('meditation_draft').get();
                            if (doc.exists && doc.data().content) {
                                txtInput.value = doc.data().content;
                                localStorage.setItem(STORAGE_KEY, doc.data().content);
                                setSyncState('synced');
                                enforceEgoDestruction(doc.data().content);
                            }
                        } catch (e) { /* ignore */ }
                    }
                }
            });

            // ربط المستمعين
            txtInput.addEventListener('input', handleInput);
            btnAnalyze.addEventListener('click', analyzeThoughts);
            
            // Hold to Burn Event Listeners
            btnHoldBurn.addEventListener('mousedown', startBurn);
            btnHoldBurn.addEventListener('touchstart', startBurn, {passive: false});
            
            window.addEventListener('mouseup', cancelBurn);
            btnHoldBurn.addEventListener('mouseleave', cancelBurn);
            window.addEventListener('touchend', cancelBurn);

            return {
                init: () => console.info("[Meditation Engine]: Online.")
            };
        })();

        // Boot
        MeditationController.init();

    </script>
</body>
