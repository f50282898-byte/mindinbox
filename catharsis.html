<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عقل في صندوق | صومعة السيادة الفكرية</title>
    
    
    
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           CATHARSIS SANCTUARY — PAPYRUS MANUSCRIPT MODE
           ============================================================ */
        :root {
            --bg: #050508;
            --text: #1a0f05;
            --text-shadow: none;
            --placeholder: rgba(26,15,5,0.4);
            --canvas-bg: url('https://images.unsplash.com/photo-1614854262318-831574f15f1f?q=85&w=2000&auto=format&fit=crop');
            --canvas-tint: rgba(15,10,5,0.55);
            --shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 1px rgba(212,168,75,0.08), inset 0 0 60px rgba(212,168,75,0.03);
            --overlay: rgba(0,0,0,0.65);
            --speed: 1.4s;
            --border: rgba(212,168,75,0.15);
            --scroll-thumb: rgba(212,168,75,0.25);
        }

        [data-theme="light"] {
            --bg: #ede8d8;
            --text: #1a0f05;
            --text-shadow: 0 1px 3px rgba(0,0,0,0.15);
            --placeholder: rgba(26,15,5,0.35);
            --canvas-bg: url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=85&w=2000&auto=format&fit=crop');
            --canvas-tint: rgba(240,232,210,0.3);
            --shadow: 0 30px 80px rgba(80,50,10,0.4), 0 0 0 1px rgba(122,92,40,0.2);
            --overlay: rgba(240,225,195,0.4);
            --border: rgba(122,92,40,0.25);
            --scroll-thumb: rgba(122,92,40,0.3);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: var(--bg);
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            overflow: hidden;
            transition: background var(--speed) ease;
        }

        /* ── VIDEO BACKGROUND ── */
        .vid-wrap {
            position: fixed; inset: 0; z-index: -2; overflow: hidden;
        }
        .bg-vid {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            transition: opacity var(--speed) ease;
        }
        .bg-vid.active  { opacity: 1; }
        .bg-vid.hidden  { opacity: 0; }

        .overlay {
            position: fixed; inset: 0; z-index: -1;
            background: var(--overlay);
            transition: background var(--speed) ease;
        }

        /* ── CONTROLS ── */
        .ctrl-bar {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 20;
            display: flex; gap: 12px; align-items: center;
        }

        .ctrl-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 22px;
            background: rgba(10,8,5,0.7);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: 'Amiri', serif;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(14px);
            transition: all 0.25s ease;
            letter-spacing: 0.03em;
        }

        [data-theme="light"] .ctrl-btn {
            background: rgba(240,230,205,0.75);
            color: #1a0f05;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(212,168,75,0.45);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        /* ── MAIN CANVAS WRAPPER ── */
        .sanctuary {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 80px 24px 40px;
        }

        /* The Papyrus Manuscript Card */
        .manuscript-card {
            position: relative;
            width: 80%;
            height: 86vh;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: box-shadow var(--speed) ease;
        }

        /* Papyrus/Marble texture layer */
        .manuscript-card::before {
            content: '';
            position: absolute; inset: 0; z-index: 1;
            background-image: var(--canvas-bg);
            background-size: cover;
            background-position: center;
            transition: background-image var(--speed) ease;
        }

        /* Subtle tint/darkening layer over texture */
        .manuscript-card::after {
            content: '';
            position: absolute; inset: 0; z-index: 2;
            background: var(--canvas-tint);
            transition: background var(--speed) ease;
        }

        /* Decorative border lines (manuscript feel) */
        .ms-border {
            position: absolute; z-index: 3;
            pointer-events: none;
        }
        .ms-border-top, .ms-border-bottom {
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, rgba(212,168,75,0.5), transparent);
        }
        .ms-border-bottom { top: auto; bottom: 0; }

        /* Corner ornaments */
        .ms-ornament {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            font-size: 1.4rem;
            color: rgba(212,168,75,0.35);
            line-height: 1;
        }
        .ms-ornament.tl { top: 10px; right: 12px; }
        .ms-ornament.tr { top: 10px; left: 12px; }
        .ms-ornament.bl { bottom: 10px; right: 12px; }
        .ms-ornament.br { bottom: 10px; left: 12px; }

        /* ── THE WRITING TEXTAREA ── */
        textarea.ms-input {
            position: relative;
            z-index: 5;
            width: 100%; height: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            padding: 60px 55px 60px 55px;
            font-family: 'Amiri', 'Noto Naskh Arabic', serif;
            font-size: 1.75rem;
            line-height: 2.1;
            color: var(--text);
            
            direction: rtl;
            transition: color var(--speed) ease, text-shadow var(--speed) ease;
            letter-spacing: 0.01em;
            word-spacing: 0.05em;
        }

        textarea.ms-input::placeholder {
            color: var(--placeholder);
            font-style: italic;
        }

        textarea.ms-input::-webkit-scrollbar { width: 6px; }
        textarea.ms-input::-webkit-scrollbar-track { background: transparent; }
        textarea.ms-input::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 3px;
        }

        /* ── WORD COUNT ── */
        .ms-wordcount {
            position: absolute;
            bottom: 18px; left: 28px;
            z-index: 6;
            font-size: 0.72rem;
            color: rgba(212,168,75,0.35);
            font-family: 'Amiri', serif;
            letter-spacing: 0.04em;
            pointer-events: none;
        }

        [data-theme="light"] .ms-wordcount { color: rgba(26,15,5,0.3); }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .manuscript-card { width: 95%; height: 82vh; }
            textarea.ms-input { padding: 40px 30px; font-size: 1.4rem; }
            .ctrl-bar { top: 14px; right: 14px; gap: 8px; }
            .ctrl-btn { padding: 8px 16px; font-size: 0.9rem; }
        }

        @media (max-width: 480px) {
            textarea.ms-input { font-size: 1.2rem; padding: 28px 20px; }
        }
    </style>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>



    <div class="overlay"></div>

    <!-- ── CONTROLS ── -->
    <nav class="ctrl-bar">
        <a href="index.html" class="ctrl-btn" id="btn-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            العودة
        </a>
        <button class="ctrl-btn" id="btn-theme">النهار ☀️</button>
    </nav>

    <!-- ── THE MANUSCRIPT CANVAS ── -->
    <div class="sanctuary">
        <div class="manuscript-card">
            <!-- Decorative borders -->
            <div class="ms-border ms-border-top ms-ornament"></div>
            <div class="ms-border ms-border-bottom ms-ornament"></div>
            <!-- Corner ornaments -->
            <span class="ms-ornament tl" aria-hidden="true">❧</span>
            <span class="ms-ornament tr" aria-hidden="true">❧</span>
            <span class="ms-ornament bl" aria-hidden="true">⁕</span>
            <span class="ms-ornament br" aria-hidden="true">⁕</span>

            <textarea class="ms-input" id="ms-textarea"
                placeholder="اكتب هنا ما يثقل الروح... فهذه اللوحة تحتضن الكلمات قبل أن تحترق..."></textarea>

            <div class="ms-wordcount" id="ms-wordcount">٠ كلمة</div>
        </div>
    </div>

    <script src="sound.js"></script>
    <script>
    (function() {
        'use strict';

        let isDark = true;
        const root    = document.documentElement;
        const themeBtn  = document.getElementById('btn-theme');
        const vidNight  = document.getElementById('vid-night');
        const vidDay    = document.getElementById('vid-day');
        const textarea  = document.getElementById('ms-textarea');
        const wordcount = document.getElementById('ms-wordcount');

        // ── THEME TOGGLE ──
        themeBtn.addEventListener('click', function() {
            isDark = !isDark;
            if (isDark) {
                root.removeAttribute('data-theme');
                themeBtn.textContent = 'النهار ☀️';
                vidNight.classList.remove('hidden'); vidNight.classList.add('active');
                vidDay.classList.remove('active');   vidDay.classList.add('hidden');
            } else {
                root.setAttribute('data-theme', 'light');
                themeBtn.textContent = 'الليل 🌙';
                vidDay.classList.remove('hidden');   vidDay.classList.add('active');
                vidNight.classList.remove('active'); vidNight.classList.add('hidden');
            }
            if (window.SovereignAudio) window.SovereignAudio.playClick();
        });

        // ── WORD COUNT ──
        textarea.addEventListener('input', function() {
            const words = textarea.value.trim().split(/\s+/).filter(Boolean).length;
            // Convert to Arabic-Indic numerals
            const arabicNumerals = words.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
            wordcount.textContent = arabicNumerals + ' كلمة';
        });

        // ── PERSIST DRAFT ──
        const DRAFT_KEY = 'mib_catharsis_draft';
        const saved = localStorage.getItem(DRAFT_KEY);
        if (saved) { textarea.value = saved; textarea.dispatchEvent(new Event('input')); }

        textarea.addEventListener('input', function() {
            localStorage.setItem(DRAFT_KEY, textarea.value);
        });

        // ── BACK BUTTON SOUND ──
        document.getElementById('btn-back').addEventListener('click', function() {
            if (window.SovereignAudio) window.SovereignAudio.playClick();
        });
    })();
    </script>

</body>
</html>
