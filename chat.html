<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>عقل في صندوق | صومعة السيادة الفكرية</title>

    
    
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ============================================================
           ELITE CHAT — SOVEREIGN DESIGN SYSTEM
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', 'Amiri', sans-serif;
            background: #06060a;
            color: #e8e0d0;
            height: 100vh;
            overflow: hidden;
        }

        #chat-container { height: 100vh; }

        /* ── CHAT SHELL LAYOUT ── */
        .chat-shell {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }

        @media (max-width: 768px) {
            .chat-shell {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            .chat-sidebar {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 8px;
                padding: 12px 16px;
                overflow-x: auto;
                border-bottom: 1px solid rgba(197,160,89,0.15);
                border-right: none !important;
            }
            .chat-sidebar-header { display: none; }
            .chat-user-capsule { display: none; }
            .chat-rooms-list { display: flex; flex-direction: row; gap: 8px; }
            .chat-room-btn { white-space: nowrap; padding: 8px 14px; }
        }

        /* ── SIDEBAR ── */
        .chat-sidebar {
            display: flex;
            flex-direction: column;
            background: rgba(10,10,16,0.98);
            border-right: 1px solid rgba(197,160,89,0.12);
            backdrop-filter: blur(20px);
        }

        .chat-sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(197,160,89,0.1);
        }

        .chat-brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(197,160,89,0.3);
        }

        .chat-brand-name {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            color: #c5a059;
        }

        .chat-pro-badge {
            display: block;
            font-size: 0.65rem;
            color: #e5b964;
            letter-spacing: 2px;
        }

        .chat-rooms-list {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .chat-room-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: #a09880;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            width: 100%;
            text-align: right;
        }

        .chat-room-btn:hover {
            background: rgba(197,160,89,0.08);
            color: #c5a059;
        }

        .chat-room-btn.active {
            background: rgba(197,160,89,0.12);
            color: #e5b964;
            border: 1px solid rgba(197,160,89,0.2);
        }

        .room-emoji { font-size: 1.1rem; }
        .room-name { flex: 1; }
        .room-unread { color: #e5b964; font-size: 1.3rem; line-height: 1; }

        .chat-user-capsule {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid rgba(197,160,89,0.1);
            margin-top: auto;
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(197,160,89,0.4);
            object-fit: cover;
        }

        .chat-user-name {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #e8e0d0;
        }

        .chat-user-status {
            display: block;
            font-size: 0.72rem;
            color: #4ade80;
        }

        /* ── MAIN CHAT AREA ── */
        .chat-main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: radial-gradient(ellipse at top, #0d0d1a 0%, #06060a 70%);
        }

        .chat-main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            border-bottom: 1px solid rgba(197,160,89,0.1);
            background: rgba(10,10,16,0.6);
            backdrop-filter: blur(20px);
        }

        .chat-room-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #c5a059;
        }

        .chat-online-count {
            font-size: 0.78rem;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .chat-messages-area::-webkit-scrollbar { width: 6px; }
        .chat-messages-area::-webkit-scrollbar-track { background: transparent; }
        .chat-messages-area::-webkit-scrollbar-thumb { background: rgba(197,160,89,0.2); border-radius: 3px; }

        /* ── MESSAGES ── */
        .chat-message {
            display: flex;
            max-width: 72%;
        }

        .chat-message.own {
            margin-right: auto;
            margin-left: 0;
            flex-direction: row-reverse;
        }

        .chat-message.other { margin-left: auto; }

        .msg-bubble {
            background: rgba(20, 20, 32, 0.8);
            border: 1px solid rgba(197,160,89,0.12);
            border-radius: 16px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
        }

        .chat-message.own .msg-bubble {
            background: rgba(197,160,89,0.12);
            border-color: rgba(197,160,89,0.25);
            border-radius: 16px 4px 16px 16px;
        }

        .chat-message.other .msg-bubble {
            border-radius: 4px 16px 16px 16px;
        }

        .msg-author {
            display: block;
            font-size: 0.72rem;
            color: #c5a059;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .msg-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e8e0d0;
            word-break: break-word;
        }

        .msg-time {
            display: block;
            font-size: 0.65rem;
            color: #6b6458;
            margin-top: 6px;
            text-align: left;
        }

        /* ── TYPING INDICATOR ── */
        .chat-typing-indicator {
            padding: 6px 28px;
            font-size: 0.8rem;
            color: #6b6458;
            font-style: italic;
        }

        /* ── INPUT AREA ── */
        .chat-input-area {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 16px 24px 24px;
            border-top: 1px solid rgba(197,160,89,0.1);
            background: rgba(10,10,16,0.6);
            backdrop-filter: blur(20px);
        }

        .chat-textarea {
            flex: 1;
            background: rgba(20,20,32,0.8);
            border: 1px solid rgba(197,160,89,0.2);
            border-radius: 14px;
            color: #e8e0d0;
            font-family: 'Amiri', serif;
            font-size: 1.05rem;
            line-height: 1.6;
            padding: 12px 18px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            direction: rtl;
            min-height: 48px;
            max-height: 120px;
        }

        .chat-textarea:focus {
            border-color: rgba(197,160,89,0.5);
            box-shadow: 0 0 0 3px rgba(197,160,89,0.05);
        }

        .chat-textarea::placeholder { color: rgba(197,160,89,0.3); }

        .chat-send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #c5a059, #e5b964);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: #06060a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(197,160,89,0.4);
        }

        /* ── ACCESS DENIED ── */
        .chat-access-denied {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
            text-align: center;
            padding: 40px;
        }

        .denied-icon { font-size: 4rem; }

        .denied-title {
            font-size: 1.8rem;
            color: #c5a059;
            font-family: 'Amiri', serif;
        }

        .denied-msg {
            font-size: 1.05rem;
            color: #a09880;
            max-width: 400px;
            line-height: 1.7;
        }

        .btn-upgrade-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #c5a059, #e5b964);
            color: #06060a;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 12px;
        }

        .btn-upgrade-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(197,160,89,0.4);
        }

        /* ── LOADING ── */
        .chat-loading-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(197,160,89,0.15);
            border-top-color: #c5a059;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body>

    <div id="chat-container">
        <div class="chat-loading-indicator">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="ai.js"></script>
    <script src="firebase-auth.js"></script>
    <script src="sound.js" defer></script>
    <script src="chat.js" defer></script>

</body>
</html>
