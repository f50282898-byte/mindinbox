<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عقل في صندوق | مخطوطة العقل</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #080808; color: var(--text-primary); font-family: var(--font-primary); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .journal-container { flex: 1; max-width: 900px; margin: 40px auto; width: 90%; display: flex; flex-direction: column; }
        .journal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 15px; margin-bottom: 30px; }
        .journal-title { font-family: var(--font-serif); font-size: 2.5rem; color: var(--gold-light); margin: 0; }
        
        .parchment-editor {
            background: rgba(18, 18, 18, 0.75);
            border: 1px solid rgba(212,175,55,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            border-radius: 4px;
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .parchment-title-input {
            background: transparent; border: none; border-bottom: 1px dashed rgba(212,175,55,0.3);
            color: var(--gold-primary); font-family: var(--font-serif); font-size: 2rem;
            padding-bottom: 10px; margin-bottom: 20px; width: 100%; outline: none;
        }
        .parchment-body-input {
            background: transparent; border: none; color: var(--text-secondary);
            font-family: var(--font-serif); font-size: 1.3rem; line-height: 2;
            flex: 1; width: 100%; resize: none; outline: none;
        }
        .status-indicator { font-size: 0.9rem; color: var(--text-tertiary); display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <nav class="navbar" style="position: static; padding: 20px; border-bottom: 1px solid rgba(212,175,55,0.1);">
        <a href="index.html" style="color: var(--gold-primary); text-decoration: none; font-family: var(--font-serif); display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            العودة للصومعة
        </a>
    </nav>

    <div class="journal-container">
        <div class="journal-header">
            <h1 class="journal-title">مخطوطة العقل</h1>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span class="status-indicator" id="saveStatus">محفوظ</span>
                <button class="luxury-btn" id="btnGenerateTome" style="font-size: 0.9rem; padding: 8px 16px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-left: 5px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    استخراج المخطوطة (PDF)
                </button>
            </div>
        </div>

        <div class="parchment-editor">
            <input type="text" class="parchment-title-input" id="journalTitle" placeholder="عنونة الخاطرة...">
            <textarea class="parchment-body-input" id="journalBody" placeholder="دوّن ما يثقل روحك هنا..."></textarea>
        </div>
    </div>

    <!-- Firebase and Logic -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="core.js"></script>
    <script src="firebase-auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const titleInput = document.getElementById('journalTitle');
            const bodyInput = document.getElementById('journalBody');
            const statusIndicator = document.getElementById('saveStatus');
            const btnGenerate = document.getElementById('btnGenerateTome');
            
            let autoSaveTimeout = null;
            let currentEntryId = new Date().toISOString().split('T')[0]; // One entry per day

            async function saveJournal() {
                const user = firebase.auth().currentUser;
                if(!user) return;

                statusIndicator.textContent = 'جاري الحفظ...';
                statusIndicator.style.color = 'var(--gold-primary)';

                try {
                    await firebase.firestore().collection('users').doc(user.uid).collection('journals').doc(currentEntryId).set({
                        title: titleInput.value.trim(),
                        body: bodyInput.value.trim(),
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                    statusIndicator.textContent = 'محفوظ تماماً';
                    statusIndicator.style.color = 'var(--text-tertiary)';
                } catch(e) {
                    console.error("Save error", e);
                    statusIndicator.textContent = 'خطأ في الحفظ';
                    statusIndicator.style.color = '#e74c3c';
                }
            }

            function triggerAutoSave() {
                statusIndicator.textContent = 'قيد التعديل...';
                statusIndicator.style.color = 'var(--text-secondary)';
                if(autoSaveTimeout) clearTimeout(autoSaveTimeout);
                autoSaveTimeout = setTimeout(saveJournal, 1500);
            }

            titleInput.addEventListener('input', triggerAutoSave);
            bodyInput.addEventListener('input', triggerAutoSave);

            firebase.auth().onAuthStateChanged(async (user) => {
                if(user) {
                    const doc = await firebase.firestore().collection('users').doc(user.uid).collection('journals').doc(currentEntryId).get();
                    if(doc.exists) {
                        titleInput.value = doc.data().title || '';
                        bodyInput.value = doc.data().body || '';
                    }
                }
            });

            btnGenerate.addEventListener('click', () => {
                alert("جاري تجميع وتجليد مخطوطاتك بصيغة PDF كلاسيكية... (API Hook Ready)");
            });
        });
    </script>
</body>
</html>
